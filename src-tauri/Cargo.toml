[package]
name = "mianxu"
version = "0.1.0"
description = "骆耀升老公酱面试助手"
authors = ["clone"]
edition = "2024"
# Tauri 用这个字段识别主二进制，保证 macOS .app 里的可执行文件与 CFBundleExecutable 一致。
default-run = "Mianxu"

[workspace]
members = ["macos-capture"]
resolver = "3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "Mianxu"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mianxu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-websocket = "2.5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
dirs = "6"
tungstenite = "0.24"

[target.'cfg(target_os = "macos")'.dependencies]
mianxu-macos-capture = { path = "macos-capture" }
security-framework = "3.7"
ring = "0.17.14"

[dev-dependencies]
mianxu-macos-capture = { path = "macos-capture" }
ring = "0.17.14"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Media_Audio",
  "Win32_Media_DeviceManager",
  "Win32_Media_KernelStreaming",
  "Win32_Devices_FunctionDiscovery",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_Security_Cryptography",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
