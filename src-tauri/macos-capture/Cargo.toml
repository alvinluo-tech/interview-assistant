[package]
name = "mianxu-macos-capture"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=11.1.1", features = ["macos_13_0"] }
core-graphics = "0.25"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSResponder"] }
