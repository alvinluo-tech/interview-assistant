name: Check Desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Check ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            shell: pwsh
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            shell: bash
          - platform: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Inspect Apple build tools
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --sdk macosx --show-sdk-version
          xcrun swift --version

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: |
            src-tauri -> target
            tools/update-verifier -> target
          # Match the release job, including its automatic compiler/OS hashes.
          shared-key: desktop-${{ matrix.target }}
          env-vars: MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true
          # PRs can restore main's cache; only trusted main runs populate it.
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release tooling
        run: pnpm test:release

      - name: Test AI protocols
        run: pnpm test:byok

      - name: Test microphone and subtitle engine
        run: pnpm test:audio

      - name: Test permission and native capture bridge
        run: pnpm test:platform

      # Includes document context, realtime ASR and reliability with coverage gates.
      - name: Test core protocols with coverage
        run: pnpm test:core-coverage

      - name: Test development service isolation
        run: pnpm test:dev-services

      - name: Test updater consent and state handling
        run: pnpm test:updater

      - name: Test update presentation and installer branding
        run: node scripts/test-update-design.mjs

      # generate_context!() in native tests embeds dist, so build it first.
      - name: Typecheck and build frontend
        run: pnpm build

      - name: Test native code on the runner architecture
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace --lib

      # Build, rather than just check, so target-specific bridges and frameworks
      # must link. Also warm release dependencies on main for future version tags.
      - name: Compile, link and package the requested architecture
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.ci.conf.json -- --locked

      - name: Verify macOS disk image and permission manifests
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          plutil -lint src-tauri/Info.plist src-tauri/Entitlements.plist
          hdiutil verify src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload test installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-test-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
