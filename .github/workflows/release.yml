name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v0.1.1 or v0.4.0-beta.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_UPDATER: 'true'
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            shell: pwsh
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            shell: bash
          - platform: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            shell: bash
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: |
            src-tauri -> target
            tools/update-verifier -> target
          shared-key: desktop-${{ matrix.target }}
          env-vars: MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true
          save-if: ${{ github.ref_type == 'tag' || github.ref == 'refs/heads/main' }}

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release tooling
        run: pnpm test:release

      - name: Synchronize package versions from tag
        id: version
        run: node scripts/release.mjs prepare

      - name: Test AI protocols
        run: pnpm test:byok

      - name: Test microphone and subtitle engine
        run: pnpm test:audio

      - name: Test permission and native capture bridge
        run: pnpm test:platform

      # This suite already executes context, realtime and reliability tests.
      - name: Test core protocols with coverage
        run: pnpm test:core-coverage

      - name: Test development service isolation
        run: pnpm test:dev-services

      - name: Test updater consent and state handling
        run: pnpm test:updater

      - name: Test update presentation and installer branding
        run: node scripts/test-update-design.mjs

      # The native tests embed the frontend via generate_context!().
      - name: Typecheck and build frontend
        run: pnpm build

      - name: Test native code with locked dependencies
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace --lib

      - name: Require release signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY) throw new Error('Missing TAURI_SIGNING_PRIVATE_KEY release secret')"

      - name: Build platform installer
        # Call Node directly: Windows package-manager shims can consume the cargo argument separator.
        # The frontend was built above for native tests; skip only the duplicate hook.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json -- --locked

      - name: Verify macOS disk image and permission manifests
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          plutil -lint src-tauri/Info.plist src-tauri/Entitlements.plist
          hdiutil verify src-tauri/target/"$RELEASE_TARGET"/release/bundle/dmg/*.dmg

      - name: Collect release assets and SHA-256 checksums
        run: node scripts/release.mjs collect

      - name: Upload verified build assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.platform }}-release
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Check out release tooling and public key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Set up signature verifier toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Download this run's build assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release-assets

      - name: Verify assets before publishing
        working-directory: release-assets
        run: |
          set -euo pipefail
          test -f "Mianxu_${VERSION}_x64-setup.exe"
          test -f "Mianxu_${VERSION}_x64-portable.exe"
          test -f "Mianxu_${VERSION}_arm64.dmg"
          test -f "Mianxu_${VERSION}_x64.dmg"
          for platform in windows-x64 macos-arm64 macos-x64; do
            sha256sum --check "${platform}-SHA256SUMS.txt"
          done
          cat *-SHA256SUMS.txt | sort -k2 > SHA256SUMS.txt

      - name: Create draft, attach assets, and publish
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft > release-status.json 2>/dev/null; then
            node -e "if (!JSON.parse(require('node:fs').readFileSync('release-status.json')).isDraft) throw new Error('Release is already public; publish a new version instead of replacing updater assets')"
          else
            gh release create "$TAG" --verify-tag --draft --title "Mianxu ${TAG}" --generate-notes --prerelease="$PRERELEASE"
          fi
          gh release view "$TAG" --json body --jq '.body' > release-notes.txt
          RELEASE_NOTES_FILE=release-notes.txt node scripts/release.mjs manifest "$TAG"
          (cd release-assets && sha256sum latest.json >> SHA256SUMS.txt)
          gh release upload "$TAG" \
            "release-assets/Mianxu_${VERSION}_x64-setup.exe" \
            "release-assets/Mianxu_${VERSION}_x64-portable.exe" \
            "release-assets/Mianxu_${VERSION}_arm64.dmg" \
            "release-assets/Mianxu_${VERSION}_x64.dmg" \
            "release-assets/Mianxu_${VERSION}_x64-setup.exe.sig" \
            "release-assets/Mianxu_${VERSION}_arm64.app.tar.gz" \
            "release-assets/Mianxu_${VERSION}_arm64.app.tar.gz.sig" \
            "release-assets/Mianxu_${VERSION}_x64.app.tar.gz" \
            "release-assets/Mianxu_${VERSION}_x64.app.tar.gz.sig" \
            release-assets/latest.json \
            release-assets/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
          gh release view "$TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
