name: Check macOS Native Code

on:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'index.html'
      - '.github/workflows/macos-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Compile ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Inspect Apple build tools
        run: |
          xcode-select -p
          xcrun --sdk macosx --show-sdk-version
          xcrun swift --version

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          key: macos-check-${{ matrix.target }}
          cache-on-failure: true

      - name: Build frontend for native embedding
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Test native code on the runner architecture
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace --lib

      - name: Test permission and native capture bridge
        run: pnpm test:platform

      # Build, rather than just check, so target-specific bridges and frameworks
      # must link. Intel output must not accidentally contain arm64 bridge code.
      - name: Compile, link and package the requested architecture
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg --ci -- --locked

      - name: Check permission manifests
        run: |
          plutil -lint src-tauri/Info.plist src-tauri/Entitlements.plist
          hdiutil verify src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload macOS test installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-test-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
